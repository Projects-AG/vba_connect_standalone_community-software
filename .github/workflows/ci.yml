name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test -- --passWithNoTests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ""
          VITE_LIVEKIT_URL: ws://localhost:7880

  deploy:
    name: Deploy to Hostinger
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "Add GitHub secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY"
            echo "See deploy/README.md (CI/CD)."
            exit 1
          fi

      - name: SSH pull and rebuild
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/loop
            mkdir -p /tmp/loop-deploy-bak
            cp -a deploy/.env.prod /tmp/loop-deploy-bak/.env.prod
            if [ -f deploy/livekit.prod.yaml ]; then
              cp -a deploy/livekit.prod.yaml /tmp/loop-deploy-bak/livekit.prod.yaml
            fi
            git fetch origin
            git reset --hard origin/main
            cp -a /tmp/loop-deploy-bak/.env.prod deploy/.env.prod
            if [ -f /tmp/loop-deploy-bak/livekit.prod.yaml ]; then
              cp -a /tmp/loop-deploy-bak/livekit.prod.yaml deploy/livekit.prod.yaml
            fi
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
            docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod ps

