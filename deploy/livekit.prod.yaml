# Production LiveKit config for Hostinger VPS.
# LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.prod MUST match the keys map below.
#
# Replace CHANGE_ME_API_KEY and the secret with the same values from .env.prod.

port: 7880
bind_addresses:
  - 0.0.0.0

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50020
  # Advertise public IP for WebRTC candidates (required behind NAT / Hostinger)
  use_external_ip: true

keys:
  # Format: <API_KEY>: <API_SECRET>
  CHANGE_ME_API_KEY: CHANGE_ME_LONG_SECRET_AT_LEAST_32_CHARS

logging:
  level: info
