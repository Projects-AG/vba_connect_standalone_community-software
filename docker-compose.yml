# Local one-app stack: UI + API behind nginx (same pattern as Azure).
# LiveKit optional for video — start with: docker compose --profile livekit up
#
# UI + API:  http://localhost:8080
# Swagger:   http://localhost:8080/api  (proxied)
# Direct API:http://localhost:3000/api  (optional)

services:
  backend:
    image: projectsag/project-loop-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      PORT: "8080"
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      LIVEKIT_HOST: "http://livekit:7880"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "myverylongsecretkey12345678901234567890"
      JWT_SECRET: "project-loop-dev-secret-change-me"
      JWT_EXPIRES_IN: "7d"
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-loop_db}
      DB_SYNC: ${DB_SYNC:-true}
    restart: unless-stopped

  web:
    image: projectsag/project-loop:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_LIVEKIT_URL: "ws://localhost:7880"
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  livekit:
    profiles: ["livekit", "recording"]
    image: livekit/livekit-server:v1.13.10
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_started
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    restart: unless-stopped

  egress:
    profiles: ["recording"]
    image: livekit/egress:v1.13.0
    cap_add:
      - SYS_ADMIN
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
      - "D:/LoopRecordings:/out"
    depends_on:
      - livekit
      - redis
    restart: unless-stopped

  redis:
    profiles: ["livekit","recording"]
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    profiles: ["recording"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: "ChangeThisLocalPassword123!"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
  
volumes:
  redis_data:
  minio_data: